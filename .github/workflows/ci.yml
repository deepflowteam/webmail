name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      BETTER_AUTH_SECRET: ci-auth-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v7
      - uses: oven/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run deploy:dry-run

  # The terminal install path is supported on Windows, where process spawning, path handling and
  # file permissions differ enough that a Linux-only gate cannot cover them.
  quality-windows:
    runs-on: windows-latest
    env:
      BETTER_AUTH_SECRET: ci-auth-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v7
      - uses: oven/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run deploy:dry-run
